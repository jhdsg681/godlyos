<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Godly Games OS — Divine Zero-Proxy Games Edition</title>
  <meta name="description" content="A breathtaking browser-based gaming operating system with 2,400+ games, fluid window manager, and zero proxy dependencies." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #070913;
      --bg-gradient: radial-gradient(circle at 15% 15%, #180d38 0%, #060913 70%, #02040a 100%);
      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --accent-secondary: #06b6d4;
      --glass-bg: rgba(15, 20, 36, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-header: rgba(22, 28, 48, 0.85);
      --glass-blur: blur(28px) saturate(180%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --dock-bg: rgba(10, 15, 29, 0.85);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    /* Themes */
    body.theme-aurora {
      --bg-gradient: radial-gradient(circle at 20% 20%, #042f2e 0%, #021a15 60%, #010c0a 100%);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --accent-secondary: #06b6d4;
      --glass-header: rgba(4, 47, 46, 0.85);
    }
    body.theme-cyberpunk {
      --bg-gradient: radial-gradient(circle at 10% 10%, #4a044e 0%, #1a0328 65%, #08010e 100%);
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.45);
      --accent-secondary: #06b6d4;
      --glass-header: rgba(74, 4, 78, 0.85);
    }
    body.theme-liquid-metal {
      --bg-gradient: radial-gradient(circle at 30% 20%, #1e293b 0%, #0f172a 60%, #020617 100%);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --accent-secondary: #94a3b8;
      --glass-header: rgba(30, 41, 59, 0.85);
    }
    body.theme-emerald {
      --bg-gradient: radial-gradient(circle at 20% 20%, #064e3b 0%, #022c22 65%, #01140f 100%);
      --accent: #34d399;
      --accent-glow: rgba(52, 211, 153, 0.45);
      --accent-secondary: #a7f3d0;
      --glass-header: rgba(6, 78, 59, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-main);
      position: fixed;
      top: 0;
      left: 0;
    }

    #canvas-stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    #os-desktop {
      position: absolute;
      inset: 0;
      background: var(--bg-gradient);
      overflow: hidden;
      z-index: 2;
    }

    /* Desktop Icon Grid */
    .desktop-icons {
      position: absolute;
      top: 24px;
      left: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 84px;
      padding: 10px 6px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid transparent;
      text-align: center;
    }
    .desktop-icon:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--glass-border);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .desktop-icon:active {
      transform: scale(0.96);
    }
    .desktop-icon .icon-img {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .desktop-icon:hover .icon-img {
      transform: scale(1.08);
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .desktop-icon .icon-label {
      font-size: 11px;
      font-weight: 600;
      color: #e2e8f0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      word-break: break-word;
      line-height: 1.2;
    }

    /* System Taskbar / Dock */
    #taskbar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      height: 56px;
      background: var(--dock-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0,0,0,0.3);
      z-index: 9999;
    }

    .dock-btn {
      height: 42px;
      padding: 0 14px;
      border-radius: 12px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }
    .dock-btn:active {
      transform: scale(0.96);
    }
    .start-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      color: #fff;
      box-shadow: 0 0 16px var(--accent-glow);
      font-weight: 700;
    }
    .start-btn:hover {
      box-shadow: 0 0 24px var(--accent-glow);
    }

    .dock-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 4px;
    }

    .dock-window-item {
      height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.18s ease;
      max-width: 160px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dock-window-item.active {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .dock-clock {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding: 0 8px;
      font-family: 'JetBrains Mono', monospace;
    }
    .clock-time {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.02em;
    }
    .clock-date {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Start Menu */
    #start-menu {
      position: absolute;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%) translateY(20px) scale(0.96);
      width: 440px;
      background: rgba(13, 18, 33, 0.94);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 30px var(--accent-glow);
      z-index: 9998;
      display: none;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #start-menu.open {
      display: block;
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }
    .start-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .start-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .start-badge {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid var(--accent);
      color: #d8b4fe;
    }
    .start-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .start-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 8px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .start-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .start-item-icon {
      font-size: 28px;
      margin-bottom: 6px;
    }
    .start-item-title {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
    }

    /* Window Manager */
    .os-window {
      position: absolute;
      border-radius: var(--radius-lg);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65), 0 0 1px rgba(255,255,255,0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 340px;
      min-height: 240px;
      transition: box-shadow 0.2s ease, opacity 0.2s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .os-window.active {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.75), 0 0 20px var(--accent-glow);
    }
    .os-window.minimized {
      opacity: 0;
      transform: scale(0.85) translateY(100px);
      pointer-events: none;
    }

    .window-header {
      height: 44px;
      background: var(--glass-header);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      cursor: grab;
      user-select: none;
      flex-shrink: 0;
    }
    .window-header:active {
      cursor: grabbing;
    }
    .window-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .window-title-icon {
      font-size: 16px;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ctrl-btn {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: bold;
      color: transparent;
      transition: all 0.15s ease;
    }
    .window-controls:hover .ctrl-btn {
      color: rgba(0, 0, 0, 0.6);
    }
    .ctrl-close { background: #ef4444; }
    .ctrl-close:hover { background: #dc2626; }
    .ctrl-min { background: #f59e0b; }
    .ctrl-min:hover { background: #d97706; }
    .ctrl-max { background: #10b981; }
    .ctrl-max:hover { background: #059669; }

    .window-content {
      flex: 1;
      overflow: hidden;
      position: relative;
      background: rgba(6, 9, 20, 0.6);
    }

    .window-resize-handle {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      z-index: 50;
    }

    /* Games Arcade Interface */
    .arcade-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .arcade-toolbar {
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.45);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }
    .toolbar-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .search-input-wrap {
      flex: 1;
      position: relative;
    }
    .search-input {
      width: 100%;
      height: 40px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 0 16px 0 40px;
      font-size: 13px;
      color: #fff;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 15px;
      pointer-events: none;
    }

    .category-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .category-pills::-webkit-scrollbar {
      display: none;
    }
    .cat-pill {
      padding: 6px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .cat-pill:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .cat-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .arcade-grid-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .arcade-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 16px var(--accent-glow);
      background: rgba(255, 255, 255, 0.08);
    }
    .card-thumb-wrap {
      width: 100%;
      height: 110px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .game-card:hover .card-thumb {
      transform: scale(1.08);
    }
    .card-thumb-fallback {
      font-size: 38px;
    }
    .card-category-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      font-size: 10px;
      font-weight: 700;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-author {
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-play-btn {
      margin-top: 8px;
      width: 100%;
      height: 30px;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .card-play-btn:hover {
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .pagination-bar {
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.5);
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
      flex-shrink: 0;
    }
    .page-btn {
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .page-btn:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
    }
    .page-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Game Frame Player Window */
    .game-player-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #000;
    }
    .game-player-bar {
      height: 36px;
      background: rgba(15, 20, 36, 0.95);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 12px;
      color: #94a3b8;
    }
    .game-frame {
      width: 100%;
      flex: 1;
      border: none;
      background: #000;
    }

    /* Calculator App */
    .calc-wrap {
      padding: 20px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .calc-screen {
      height: 60px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-family: 'JetBrains Mono', monospace;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      overflow-x: auto;
    }
    .calc-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .calc-key {
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .calc-key:hover {
      background: rgba(255,255,255,0.15);
      border-color: var(--accent);
    }
    .calc-key.op {
      background: rgba(168, 85, 247, 0.2);
      border-color: var(--accent);
      color: #d8b4fe;
    }
    .calc-key.eq {
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      color: #fff;
    }

    /* Notes App */
    .notes-wrap {
      padding: 16px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .notes-textarea {
      flex: 1;
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }
    .notes-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    /* Terminal App */
    .terminal-wrap {
      width: 100%;
      height: 100%;
      background: #060913;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #38bdf8;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .terminal-input-line {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .terminal-prompt {
      color: var(--accent);
      font-weight: 700;
    }
    .terminal-input {

    // Sound Synthesizer via Web Audio API
    let audioCtx = null;
    let soundEnabled = true;

    function playSound(type = 'click') {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(850, now + 0.05);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'launch') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(740, now + 0.12);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'close') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(540, now);
          osc.frequency.exponentialRampToValueAtTime(260, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('sound-icon');
      if (icon) icon.textContent = soundEnabled ? '🔊' : '🔇';
      playSound('click');
    }

    function toggleFullscreen() {
      playSound('click');
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Animated Starfield
    (function initStars() {
      const canvas = document.getElementById('canvas-stars');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });
      const stars = Array.from({ length: 85 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        size: Math.random() * 1.6 + 0.4,
        alpha: Math.random() * 0.8 + 0.2,
        speed: Math.random() * 0.015 + 0.005
      }));
      function render() {
        ctx.clearRect(0, 0, w, h);
        for (const s of stars) {
          s.alpha += s.speed;
          if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, Math.min(1, s.alpha))})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(render);
      }
      render();
    })();

    // Digital Clock
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      const timeStr = `${hours}:${minutes}:${seconds} ${ampm}`;
      const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const tEl = document.getElementById('clock-time');
      const dEl = document.getElementById('clock-date');
      if (tEl) tEl.textContent = timeStr;
      if (dEl) dEl.textContent = dateStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Window Manager State
    let highestZ = 100;
    const windows = new Map();

    function bringToFront(winEl) {
      highestZ += 2;
      winEl.style.zIndex = highestZ;
      document.querySelectorAll('.os-window').forEach(w => w.classList.remove('active'));
      winEl.classList.remove('minimized');
      winEl.classList.add('active');
      updateDockWindows();
    }

    function toggleStartMenu() {
      playSound('click');
      const menu = document.getElementById('start-menu');
      if (menu) menu.classList.toggle('open');
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('start-menu');
      const startBtn = document.querySelector('.start-btn');
      if (menu && menu.classList.contains('open')) {
        if (!menu.contains(e.target) && !startBtn.contains(e.target)) {
          menu.classList.remove('open');
        }
      }
    });

    function makeDraggable(winEl, headerEl) {
      let isDragging = false;
      let startX, startY, initialX, initialY;

      headerEl.addEventListener('mousedown', (e) => {
        if (e.target.closest('.ctrl-btn') || winEl.dataset.maximized === 'true') return;
        isDragging = true;
        bringToFront(winEl);
        startX = e.clientX;
        startY = e.clientY;
        const rect = winEl.getBoundingClientRect();
        initialX = rect.left;
        initialY = rect.top;

        function onMouseMove(moveEvent) {
          if (!isDragging) return;
          const dx = moveEvent.clientX - startX;
          const dy = moveEvent.clientY - startY;
          winEl.style.left = Math.max(10, Math.min(window.innerWidth - 100, initialX + dx)) + 'px';
          winEl.style.top = Math.max(10, Math.min(window.innerHeight - 80, initialY + dy)) + 'px';
        }

        function onMouseUp() {
          isDragging = false;
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
        }

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });
    }

    function createWindow({ id, title, icon, width = 880, height = 580, contentHtml, onInit }) {
      playSound('launch');
      const container = document.getElementById('windows-container');
      
      // If already exists, focus it
      if (windows.has(id)) {
        const existing = windows.get(id);
        bringToFront(existing.el);
        return existing;
      }

      const winEl = document.createElement('div');
      winEl.className = 'os-window active';
      winEl.id = `win-${id}`;
      winEl.style.width = Math.min(width, window.innerWidth - 40) + 'px';
      winEl.style.height = Math.min(height, window.innerHeight - 100) + 'px';
      
      // Center window with slight offset
      const offset = (windows.size * 25) % 120;
      winEl.style.left = Math.max(20, (window.innerWidth - width) / 2 + offset) + 'px';
      winEl.style.top = Math.max(30, (window.innerHeight - height) / 2 - 20 + offset) + 'px';
      
      winEl.innerHTML = `
        <div class="window-header">
          <div class="window-title-wrap">
            <span class="window-title-icon">${icon}</span>
            <span>${title}</span>
          </div>
          <div class="window-controls">
            <button class="ctrl-btn ctrl-min" title="Minimize">−</button>
            <button class="ctrl-btn ctrl-max" title="Maximize">□</button>
            <button class="ctrl-btn ctrl-close" title="Close">✕</button>
          </div>
        </div>
        <div class="window-content">${contentHtml}</div>
        <div class="window-resize-handle"></div>
      `;

      container.appendChild(winEl);
      bringToFront(winEl);

      const header = winEl.querySelector('.window-header');
      makeDraggable(winEl, header);

      // Window Controls
      const closeBtn = winEl.querySelector('.ctrl-close');
      const minBtn = winEl.querySelector('.ctrl-min');
      const maxBtn = winEl.querySelector('.ctrl-max');

      closeBtn.addEventListener('click', () => {
        playSound('close');
        winEl.remove();
        windows.delete(id);
        updateDockWindows();
      });

      minBtn.addEventListener('click', () => {
        playSound('click');
        winEl.classList.add('minimized');
        winEl.classList.remove('active');
        updateDockWindows();
      });

      maxBtn.addEventListener('click', () => {
        playSound('click');
        if (winEl.dataset.maximized === 'true') {
          winEl.dataset.maximized = 'false';
          winEl.style.top = winEl.dataset.prevTop;
          winEl.style.left = winEl.dataset.prevLeft;
          winEl.style.width = winEl.dataset.prevWidth;
          winEl.style.height = winEl.dataset.prevHeight;
          winEl.style.borderRadius = 'var(--radius-lg)';
        } else {
          winEl.dataset.maximized = 'true';
          winEl.dataset.prevTop = winEl.style.top;
          winEl.dataset.prevLeft = winEl.style.left;
          winEl.dataset.prevWidth = winEl.style.width;
          winEl.dataset.prevHeight = winEl.style.height;
          winEl.style.top = '0px';
          winEl.style.left = '0px';
          winEl.style.width = '100vw';
          winEl.style.height = 'calc(100vh - 72px)';
          winEl.style.borderRadius = '0px';
        }
      });

      winEl.addEventListener('mousedown', () => bringToFront(winEl));

      const winObj = { id, title, icon, el: winEl };
      windows.set(id, winObj);
      updateDockWindows();

      if (typeof onInit === 'function') onInit(winEl);
      return winObj;
    }

    function updateDockWindows() {
      const dockList = document.getElementById('dock-windows');
      if (!dockList) return;
      dockList.innerHTML = '';
      windows.forEach((w) => {
        const item = document.createElement('div');
        item.className = 'dock-window-item' + (w.el.classList.contains('active') && !w.el.classList.contains('minimized') ? ' active' : '');
        item.innerHTML = `<span>${w.icon}</span><span>${w.title}</span>`;
        item.onclick = () => {
          playSound('click');
          if (w.el.classList.contains('minimized')) {
            w.el.classList.remove('minimized');
            bringToFront(w.el);
          } else if (w.el.classList.contains('active')) {
            w.el.classList.add('minimized');
            w.el.classList.remove('active');
            updateDockWindows();
          } else {
            bringToFront(w.el);
          }
        };
        dockList.appendChild(item);
      });
    }

          width: 520,
          height: 440,
          contentHtml: `
            <div class="notes-wrap">
              <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#94a3b8;">
                <span>Autosaved to Local Storage</span>
                <button class="page-btn" onclick="clearNotes()">Clear</button>
              </div>
              <textarea class="notes-textarea" id="notes-input" placeholder="Type game codes, walkthroughs, or notes here..."></textarea>
            </div>
          `,
          onInit: (el) => {
            const ta = el.querySelector('#notes-input');
            ta.value = localStorage.getItem('godly_games_notes') || 'Welcome to Godly Games OS!\n\n• Over 2,400 unblocked zero-proxy games included.\n• Enjoy offline or online direct gameplay.\n• Use Terminal or Search in Arcade to find your favorite titles.';
            ta.addEventListener('input', () => {
              localStorage.setItem('godly_games_notes', ta.value);
            });
          }
        });
      } else if (appId === 'terminal') {
        createWindow({
          id: 'terminal',
          title: 'Godly Shell',
          icon: '💻',
          width: 640,
          height: 420,
          contentHtml: `
            <div class="terminal-wrap" id="term-output">
              <div>Godly Games OS Shell v4.4 [Zero-Proxy Edition]</div>
              <div>Type <span style="color:#a855f7;">help</span> to view available shell commands.</div>
              <div style="margin-top:8px;"></div>
            </div>
            <div style="background:#040711; padding:8px 16px; border-top:1px solid rgba(255,255,255,0.1); display:flex; gap:8px;">
              <span class="terminal-prompt">godly@games:~$</span>
              <input type="text" class="terminal-input" id="term-input" autocomplete="off" spellcheck="false" />
            </div>
          `,
          onInit: setupTerminal
        });
      } else if (appId === 'themes') {
        createWindow({
          id: 'themes',
          title: 'Theme Studio',
          icon: '🎨',
          width: 480,
          height: 420,
          contentHtml: `
            <div class="theme-studio-wrap">
              <div style="font-size:13px; font-weight:700;">Desktop Themes & Accents</div>
              <div class="theme-options-grid">
                <div class="theme-card active" onclick="setTheme('theme-cosmic')">
                  <div class="theme-card-title">🌌 Cosmic Abyss</div>
                  <div class="theme-card-desc">Deep purple nebula & neon aura</div>
                </div>
                <div class="theme-card" onclick="setTheme('theme-aurora')">
                  <div class="theme-card-title">🌲 Aurora Borealis</div>
                  <div class="theme-card-desc">Emerald green & northern lights</div>
                </div>
                <div class="theme-card" onclick="setTheme('theme-cyberpunk')">
                  <div class="theme-card-title">⚡ Cyberpunk Rose</div>
                  <div class="theme-card-desc">Vibrant magenta & deep cyber violet</div>
                </div>
                <div class="theme-card" onclick="setTheme('theme-liquid-metal')">
                  <div class="theme-card-title">🛸 Liquid Metal</div>
                  <div class="theme-card-desc">Titanium silver & deep space slate</div>
                </div>
                <div class="theme-card" onclick="setTheme('theme-emerald')">
                  <div class="theme-card-title">💎 Emerald Obsidian</div>
                  <div class="theme-card-desc">Lush jade glow & obsidian black</div>
                </div>
              </div>
            </div>
          `
        });
      }
    }

    function setTheme(themeClass) {
      playSound('click');
      document.body.className = themeClass;
      document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('active'));
      const activeCard = Array.from(document.querySelectorAll('.theme-card')).find(c => c.getAttribute('onclick').includes(themeClass));
      if (activeCard) activeCard.classList.add('active');
    }

    function clearNotes() {
      playSound('click');
      const ta = document.getElementById('notes-input');
      if (ta) {
        ta.value = '';
        localStorage.removeItem('godly_games_notes');
      }
    }

    // Calculator Logic
    let calcVal = '0';
    let calcPendingOp = null;
    let calcPrevVal = null;

    function calcAction(btn) {
      playSound('click');
      const disp = document.getElementById('calc-display');
      if (!disp) return;

      if (btn === 'C') {
        calcVal = '0';
        calcPendingOp = null;
        calcPrevVal = null;
      } else if (btn === '+/-') {
        calcVal = String(-parseFloat(calcVal));
      } else if (btn === '%') {
        calcVal = String(parseFloat(calcVal) / 100);
      } else if (['+', '-', '*', '/'].includes(btn)) {
        calcPrevVal = parseFloat(calcVal);
        calcPendingOp = btn;
        calcVal = '0';
      } else if (btn === '=') {
        if (calcPendingOp && calcPrevVal !== null) {
          const cur = parseFloat(calcVal);
          let res = 0;
          if (calcPendingOp === '+') res = calcPrevVal + cur;
          else if (calcPendingOp === '-') res = calcPrevVal - cur;
          else if (calcPendingOp === '*') res = calcPrevVal * cur;
          else if (calcPendingOp === '/') res = cur !== 0 ? calcPrevVal / cur : 'Error';
          calcVal = String(res);
          calcPendingOp = null;
          calcPrevVal = null;
        }
      } else if (btn === '.') {
        if (!calcVal.includes('.')) calcVal += '.';
      } else {
        if (calcVal === '0') calcVal = btn;
        else calcVal += btn;
      }
      disp.textContent = calcVal;
    }

    // Terminal Logic
    function setupTerminal(winEl) {
      const input = winEl.querySelector('#term-input');
      const output = winEl.querySelector('#term-output');
      if (!input || !output) return;

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const cmd = input.value.trim();
          input.value = '';
          if (!cmd) return;
          printTerm(`godly@games:~$ ${cmd}`, 'color:#a855f7;');
          handleTermCmd(cmd);
          output.scrollTop = output.scrollHeight;
        }
      });

      function printTerm(text, style = '') {
        const line = document.createElement('div');
        line.style = style;
        line.innerHTML = text;
        output.appendChild(line);
      }

      function handleTermCmd(cmd) {
        const [action, ...args] = cmd.split(' ');
        const argStr = args.join(' ').toLowerCase();

        if (action === 'help') {
          printTerm('Available commands:');
          printTerm('  <span style="color:#38bdf8;">games</span> - Show total games count & category breakdown');
          printTerm('  <span style="color:#38bdf8;">search &lt;query&gt;</span> - Search games catalog');
          printTerm('  <span style="color:#38bdf8;">play &lt;query/random&gt;</span> - Launch a matching game in OS window');
          printTerm('  <span style="color:#38bdf8;">theme &lt;cosmic|aurora|cyberpunk|metal|emerald&gt;</span> - Switch theme');
          printTerm('  <span style="color:#38bdf8;">neofetch</span> - Display system architecture & info');
          printTerm('  <span style="color:#38bdf8;">clear</span> - Clear screen');
        } else if (action === 'clear') {
          output.innerHTML = '';
        } else if (action === 'games') {
          printTerm(`Total games registered: <b>${GAMES_DATA.length}</b>`);
          printTerm(`• GN Math Engine: 840 games`);
          printTerm(`• Classic Retro Archive: 1,567 games`);
        } else if (action === 'search') {
          if (!argStr) return printTerm('Usage: search &lt;title&gt;');
          const matches = GAMES_DATA.filter(g => g.title.toLowerCase().includes(argStr)).slice(0, 10);
          if (matches.length === 0) return printTerm('No games found matching: ' + argStr, 'color:#ef4444;');
          printTerm(`Found ${matches.length} matches:`);
          matches.forEach(m => printTerm(`• <b>${m.title}</b> [${m.category}] (ID: ${m.id})`));
        } else if (action === 'play') {
          if (!argStr || argStr === 'random') {
            launchRandomGame();
            printTerm('Launching random game...', 'color:#10b981;');
          } else {
            const match = GAMES_DATA.find(g => g.title.toLowerCase().includes(argStr));
            if (match) {
              launchGame(match);
              printTerm(`Launching: <b>${match.title}</b>`, 'color:#10b981;');
            } else {
              printTerm('No game found matching: ' + argStr, 'color:#ef4444;');
            }
          }
        } else if (action === 'neofetch') {
          printTerm(`
<pre style="color:#c084fc; font-size:11px; margin:4px 0;">
  ╭──────────────────────────────────╮
  │   ✦ GODLY GAMES OS — DIVINE      │
  │   OS Version: v4.4 Standalone    │
  │   Kernel: Zero-Proxy Pure Engine │
  │   Catalog: ${GAMES_DATA.length} Games Direct     │
  │   Uptime: Live In-Browser        │
  │   Theme: VisionOS Ambient Glass  │
  ╰──────────────────────────────────╯
</pre>
          `);
        } else if (action === 'theme') {
          if (argStr.includes('aurora')) setTheme('theme-aurora');
          else if (argStr.includes('cyber')) setTheme('theme-cyberpunk');
          else if (argStr.includes('metal')) setTheme('theme-liquid-metal');
          else if (argStr.includes('emerald')) setTheme('theme-emerald');
          else setTheme('theme-cosmic');
          printTerm('Theme updated to: ' + argStr);
        } else {
          printTerm('Command not recognized: ' + action + '. Type "help" for list of commands.', 'color:#ef4444;');
        }
      }
    }

    // Arcade Setup & Rendering
    function setupArcade(winEl) {
      const searchInput = winEl.querySelector('#arcade-search');
      const grid = winEl.querySelector('#arcade-grid');
      const catPills = winEl.querySelectorAll('.cat-pill');
      const pageInfo = winEl.querySelector('#arcade-page-info');
      const btnPrev = winEl.querySelector('#btn-prev-page');
      const btnNext = winEl.querySelector('#btn-next-page');

      let currentCat = 'all';
      let currentQuery = '';
      let currentPage = 1;
      const pageSize = 48;

      function getFilteredGames() {
        return GAMES_DATA.filter(g => {
          const matchesCat = currentCat === 'all' || 
            (currentCat === 'GN Math' && g.category === 'GN Math') ||
            (currentCat === 'Classic Retro' && g.category !== 'GN Math') ||
            g.category.toLowerCase().includes(currentCat.toLowerCase());
          const matchesQuery = !currentQuery || 
            g.title.toLowerCase().includes(currentQuery) ||
            (g.author && g.author.toLowerCase().includes(currentQuery));
          return matchesCat && matchesQuery;
        });
      }

      function renderGrid() {
        const filtered = getFilteredGames();
        const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIdx = (currentPage - 1) * pageSize;
        const pageItems = filtered.slice(startIdx, startIdx + pageSize);

        pageInfo.textContent = `Showing ${startIdx + 1}–${Math.min(startIdx + pageSize, filtered.length)} of ${filtered.length.toLocaleString()} games (Page ${currentPage} of ${totalPages})`;
        btnPrev.disabled = currentPage <= 1;
        btnNext.disabled = currentPage >= totalPages;

        grid.innerHTML = '';
        if (pageItems.length === 0) {
          grid.innerHTML = '<div style="grid-column: 1 / -1; padding: 40px; text-align: center; color: #94a3b8;">No games found matching your search.</div>';
          return;
        }

        pageItems.forEach(game => {
          const card = document.createElement('div');
          card.className = 'game-card';
          
          let thumbHtml = '';
          if (game.cover) {
            thumbHtml = `<img class="card-thumb" src="${game.cover}" loading="lazy" alt="${game.title}" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\'card-thumb-fallback\'>🎮</div>';" />`;
          } else {
            const gradients = [
              'linear-gradient(135deg, #4f46e5, #06b6d4)',
              'linear-gradient(135deg, #9333ea, #ec4899)',
              'linear-gradient(135deg, #10b981, #0ea5e9)',
              'linear-gradient(135deg, #f59e0b, #ef4444)'
            ];
            const gIdx = Math.abs(game.title.charCodeAt(0) || 0) % gradients.length;
            thumbHtml = `<div style="width:100%;height:100%;background:${gradients[gIdx]};display:flex;align-items:center;justify-content:center;font-size:32px;">🎮</div>`;
          }

          card.innerHTML = `
            <div class="card-thumb-wrap">
              ${thumbHtml}
              <div class="card-category-tag">${game.category}</div>
            </div>
            <div class="card-body">
              <div class="card-title" title="${game.title}">${game.title}</div>
              <div class="card-author">${game.author || 'Unblocked'}</div>
              <button class="card-play-btn">▶ Play Game</button>
            </div>
          `;

          card.onclick = () => launchGame(game);
          grid.appendChild(card);
        });
      }

      searchInput.addEventListener('input', (e) => {
        currentQuery = e.target.value.toLowerCase().trim();
        currentPage = 1;
        renderGrid();
      });

      catPills.forEach(pill => {
        pill.addEventListener('click', () => {
          playSound('click');
          catPills.forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          currentCat = pill.dataset.cat;
          currentPage = 1;
          renderGrid();
        });
      });

      btnPrev.addEventListener('click', () => {
        if (currentPage > 1) {
          playSound('click');
          currentPage--;
          renderGrid();
          winEl.querySelector('.arcade-grid-wrap').scrollTop = 0;
        }
      });

      btnNext.addEventListener('click', () => {
        playSound('click');
        currentPage++;
        renderGrid();
        winEl.querySelector('.arcade-grid-wrap').scrollTop = 0;
      });

      renderGrid();
    }

    // Launch Game in its own OS Window
    function launchGame(game) {
      const winId = `game-${game.id}`;
      createWindow({
        id: winId,
        title: game.title,
        icon: '🎮',
        width: 1020,
        height: 660,
        contentHtml: `
          <div class="game-player-wrap">
            <div class="game-player-bar">
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="color:var(--accent); font-weight:700;">${game.title}</span>
                <span style="font-size:11px; color:#64748b;">[${game.category}]</span>
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                <button class="page-btn" onclick="reloadGameFrame('${winId}')">↻ Reload</button>
                <button class="page-btn" onclick="fullscreenGameFrame('${winId}')">⛶ Fullscreen</button>
                <a href="${game.url}" target="_blank" class="page-btn" style="text-decoration:none;">↗ External Tab</a>
              </div>
            </div>
            <iframe 
              id="frame-${winId}" 
              class="game-frame" 
              src="${game.url}" 
              allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; keyboard-map" 
              allowfullscreen="true">
            </iframe>
          </div>
        `
      });
    }

    function reloadGameFrame(winId) {
      playSound('click');
      const frame = document.getElementById(`frame-${winId}`);
      if (frame) {
        const src = frame.src;
        frame.src = '';
        setTimeout(() => { frame.src = src; }, 50);
      }
    }

    function fullscreenGameFrame(winId) {
      playSound('click');
      const frame = document.getElementById(`frame-${winId}`);
      if (frame) {
        if (frame.requestFullscreen) frame.requestFullscreen();
        else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
      }
    }

    function launchRandomGame() {
      if (GAMES_DATA.length === 0) return;
      const randIdx = Math.floor(Math.random() * GAMES_DATA.length);
      const randGame = GAMES_DATA[randIdx];
      launchGame(randGame);
    }

    // Auto launch Arcade on initial boot
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        openApp('arcade');
      }, 300);
    });
  </script>
</body>
</html>
